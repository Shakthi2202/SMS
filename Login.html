<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Connect — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="dot"></span>Campus Connect</div>
</div>

<div class="auth-wrap">
<form id="loginForm">
    <div class="form-title">
        <div class="badge">Student Portal</div>
        <h2>Sign In</h2>
    </div>

    <label class="field-label" for="email">Username</label>
    <input id="email" type="email" placeholder="you@campus.edu" required>

    <label class="field-label" for="password">Password</label>
    <input id="password" type="password" placeholder="Password" required>

    <button type="submit">Sign In</button>
    <a class="btn" href="Register.html">Create Account</a>
    <p class="form-hint">No account yet? Registering creates one you can sign in with.</p>
</form>
</div>

<script src="app.js"></script>
<script src="auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const success = loginUser(email, password);

    if(success){
        setTimeout(function(){
            window.location.href = "Home.html";
        }, 900);
    }
});
</script>

</body>
</html>
